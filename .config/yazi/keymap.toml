[manager]
keymap = [
    # Navigation
    { on = [ "k" ], run = "arrow -1", desc = "Move cursor up" },
    { on = [ "j" ], run = "arrow 1",  desc = "Move cursor down" },
    { on = [ "h" ], run = "back",     desc = "Go back" },
    { on = [ "l" ], run = "open",     desc = "Open" },

    # Enter / Open
    { on = [ "<Enter>" ], run = "open",               desc = "Open selected" },
    { on = [ "o" ],       run = "open --interactive", desc = "Open with menu" },

    # Selection & Operations
    { on = [ "<Esc>" ],  run = ["escape --select", "escape"], desc = "Escape / deselect" },
    { on = [ "space" ], run = "select --state=toggle",        desc = "Toggle selection" },
    { on = [ "y" ],     run = "yank",                         desc = "Yank (copy)" },
    { on = [ "x" ],     run = "yank --cut",                   desc = "Cut" },
    { on = [ "p" ],     run = "paste",                        desc = "Paste" },
    { on = [ "d" ],     run = "remove",                       desc = "Move to trash" },

    # Search & Help
    { on = [ "/" ], run = "search fd", desc = "Search files" },
    { on = [ "i" ], run = "help",      desc = "Show help" },
    { on = [ "q" ], run = "quit",      desc = "Quit" },
]
